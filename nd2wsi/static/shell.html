<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>nd2wsi-viewer</title>
<link rel="stylesheet" href="static/native-shell-v1.css" />
</head>
<body>
<div id="dropzone" hidden></div>
<div id="tabbar">
  <div id="chrome-pad" class="pywebview-drag-region"></div>
  <button id="newtab" type="button" title="Open another slide" aria-label="Open another slide">+</button>
  <div id="tabbar-space" class="pywebview-drag-region"></div>
  <details id="window-menu" hidden>
    <summary id="window-identity" aria-label="Window identity and new window actions"></summary>
    <div class="window-actions" role="group" aria-label="New native window">
      <button id="new-user-window" type="button">New Window <kbd>⌘N</kbd></button>
      <button id="new-agent-window" type="button">New Agent Window <kbd>⇧⌘N</kbd></button>
      <span id="window-action-status" role="status" aria-live="polite"></span>
    </div>
  </details>
  <button id="update-check" class="shell-icon-button" type="button"
          title="Check for Updates…" aria-label="Check for Updates" disabled>
    <svg class="update-icon" viewBox="0 0 18 18" aria-hidden="true">
      <path d="M14.6 6.1A6.2 6.2 0 1 0 15 10" />
      <path d="M14.7 2.7v3.8h-3.8" />
    </svg>
  </button>
  <button id="compare-tools-toggle" class="shell-icon-button" type="button"
          title="Show comparison tools" aria-label="Show comparison tools"
          aria-expanded="false" aria-controls="compare-controls" hidden>
    <svg class="hotspot-icon" viewBox="0 0 24 18" aria-hidden="true">
      <path d="M2 5h5m4 0h11M2 13h11m4 0h5" />
      <path d="M7 2v6h4V2ZM13 10v6h4v-6Z" />
    </svg>
  </button>
  <button id="compare-toggle" class="shell-icon-button" type="button"
          title="Compare slides (⌘\)" aria-label="Compare slides"
          aria-haspopup="menu" aria-expanded="false"
          aria-controls="compare-picker-list" disabled>
    <svg class="hotspot-icon" viewBox="0 0 28 18" aria-hidden="true">
      <path d="M11.2 4.2H8.5a4.8 4.8 0 0 0 0 9.6h2.7" />
      <path d="M16.8 4.2h2.7a4.8 4.8 0 0 1 0 9.6h-2.7" />
      <path d="M9.7 9h8.6" />
    </svg>
  </button>
  <section id="compare-picker" aria-labelledby="compare-picker-title" hidden>
    <div class="compare-picker-head">
      <div class="compare-picker-heading">
        <div class="compare-picker-eyebrow">Compare from</div>
        <div id="compare-picker-title">Choose the slide to link</div>
      </div>
      <button id="compare-picker-close" type="button"
              aria-label="Cancel slide selection">×</button>
    </div>
    <div class="compare-picker-current">
      <span>Current slide</span>
      <strong id="compare-picker-current-name"></strong>
    </div>
    <div id="compare-picker-list" role="menu"
         aria-label="Choose another open slide"></div>
  </section>
</div>
<div id="frames">
  <div id="empty" hidden>
    <div>
      <div class="pyr" aria-hidden="true"><div class="l1"></div><div class="l2"></div><div class="l3"></div></div>
      <h1>Drop a slide to open</h1>
      <div class="sub"><b>.nd2</b>, <b>.svs</b>, <b>.nd2svs</b>, or press + to browse</div>
    </div>
  </div>
  <div id="compare-divider" hidden aria-hidden="true"></div>
  <div id="compare-controls" role="toolbar" aria-label="Linked slides" hidden>
    <div class="compare-row">
      <span id="compare-status">Linked</span>
      <div id="compare-chips" aria-label="Linked slides"></div>
      <button id="compare-add" class="compare-control" type="button"
              title="Link another open slide" aria-label="Link another slide"
              aria-haspopup="menu" aria-expanded="false" aria-controls="compare-picker-list">+</button>
      <span id="compare-delta" hidden></span>
      <button id="compare-link" class="compare-control linked" type="button"
              aria-label="Unlink views" aria-pressed="true">
        <svg class="hotspot-icon" viewBox="0 0 28 18" aria-hidden="true">
          <path d="M11.2 4.2H8.5a4.8 4.8 0 0 0 0 9.6h2.7" />
          <path d="M16.8 4.2h2.7a4.8 4.8 0 0 1 0 9.6h-2.7" />
          <path d="M9.7 9h8.6" />
        </svg>
      </button>
      <button id="compare-swap" class="compare-control" type="button"
              title="Swap sides" aria-label="Swap the anchor and the linked slide">⇄</button>
      <button id="compare-align" class="compare-control text-control" type="button"
              title="Align with four points on every slide"
              aria-label="Align with landmarks" aria-pressed="false">Align</button>
      <button id="compare-close" class="compare-control" type="button"
              title="Hide comparison tools — slides stay linked"
              aria-label="Hide comparison tools">×</button>
    </div>
    <div id="compare-orientation" class="compare-row orientation-panel" role="group" aria-label="Slide orientation">
      <label for="compare-orientation-target">Active linked slide</label>
      <select id="compare-orientation-target" aria-label="Active linked slide" aria-describedby="compare-orientation-hint"></select>
      <div class="orientation-actions">
        <button id="compare-flip-horizontal" class="compare-control text-control" type="button"
          title="Flip the selected image left-to-right on screen (⌘F)" aria-label="Flip horizontally">Flip ↔</button>
        <button id="compare-flip-vertical" class="compare-control text-control" type="button"
                title="Flip the selected image top-to-bottom on screen" aria-label="Flip vertically">Flip ↕</button>
        <button id="compare-rotate-left" class="compare-control text-control" type="button"
                title="Rotate the selected image 90° counterclockwise" aria-label="Rotate left 90 degrees">↶ 90°</button>
        <button id="compare-rotate-right" class="compare-control text-control" type="button"
          title="Rotate the selected image 90° clockwise (⌘R)" aria-label="Rotate right 90 degrees">↷ 90°</button>
        <button id="compare-transpose" class="compare-control text-control" type="button"
                title="Swap horizontal and vertical image axes (diagonal reflection)">Transpose</button>
        <button id="compare-orientation-reset" class="compare-control text-control" type="button"
                title="Restore manual orientation, keeping the current center">Reset Orientation</button>
        <button id="compare-remove-fit" class="compare-control text-control" type="button"
                title="Remove the fitted transform and offset; keep manual orientation">Remove Fit</button>
      </div>
      <label for="compare-mapping">Mapping</label>
      <select id="compare-mapping" aria-label="Alignment coordinate mapping">
        <option value="physical">Calibrated when available</option>
        <option value="relative">Relative · display only</option>
      </select>
      <output id="compare-orientation-state" aria-live="polite"></output>
      <span id="compare-orientation-hint">Reference stays fixed · display only</span>
    </div>
    <div id="compare-landmarks" class="compare-row landmark-panel" hidden>
      <div id="compare-landmark-rows"></div>
      <div id="compare-landmark-hint" class="landmark-hint"></div>
      <div class="landmark-actions">
        <label for="compare-mirror-policy">Mirror</label>
        <select id="compare-mirror-policy" aria-label="Landmark mirror policy">
          <option value="keep">Keep mirror state</option>
          <option value="infer">Infer mirror from landmarks</option>
        </select>
        <button id="compare-landmark-clear" class="compare-control text-control" type="button"
                title="Clear draft points only; keep the committed alignment">Clear Points</button>
        <button id="compare-landmark-cancel" class="compare-control text-control" type="button"
                title="Leave alignment mode and put back the previous alignment (esc)">Cancel</button>
        <button id="compare-landmark-done" class="compare-control text-control primary" type="button"
                title="Keep this alignment (⏎)">Done</button>
      </div>
    </div>
  </div>
</div>
<div id="shell-toast" role="alert" aria-live="assertive"></div>
<script src="static/align-v1.js"></script>
<script src="static/shortcut-router-v1.js"></script>
<script src="static/native-scope-v1.js"></script>
<script src="static/shell-v1.js"></script>
<script src="static/window-controls-v1.js"></script>
</body>
</html>
