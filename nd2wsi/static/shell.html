<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>nd2wsi-viewer</title>
<link rel="stylesheet" href="static/native-shell-v1.css" />
</head>
<body>
<div id="dropzone" hidden></div>
<div id="tabbar">
  <div id="chrome-pad" class="pywebview-drag-region"></div>
  <button id="newtab" type="button" title="Open another slide" aria-label="Open another slide">+</button>
  <div id="tabbar-space" class="pywebview-drag-region"></div>
  <button id="update-check" class="shell-icon-button" type="button"
          title="Check for Updates…" aria-label="Check for Updates" disabled>
    <svg class="update-icon" viewBox="0 0 18 18" aria-hidden="true">
      <path d="M14.6 6.1A6.2 6.2 0 1 0 15 10" />
      <path d="M14.7 2.7v3.8h-3.8" />
    </svg>
  </button>
  <button id="compare-toggle" class="shell-icon-button" type="button"
          title="Compare slides (⌘\)" aria-label="Compare slides"
          aria-haspopup="menu" aria-expanded="false"
          aria-controls="compare-picker-list" disabled>
    <svg class="hotspot-icon" viewBox="0 0 28 18" aria-hidden="true">
      <path d="M11.2 4.2H8.5a4.8 4.8 0 0 0 0 9.6h2.7" />
      <path d="M16.8 4.2h2.7a4.8 4.8 0 0 1 0 9.6h-2.7" />
      <path d="M9.7 9h8.6" />
    </svg>
  </button>
  <section id="compare-picker" aria-labelledby="compare-picker-title" hidden>
    <div class="compare-picker-head">
      <div class="compare-picker-heading">
        <div class="compare-picker-eyebrow">Compare from</div>
        <div id="compare-picker-title">Choose the slide to link</div>
      </div>
      <button id="compare-picker-close" type="button"
              aria-label="Cancel slide selection">×</button>
    </div>
    <div class="compare-picker-current">
      <span>Current slide</span>
      <strong id="compare-picker-current-name"></strong>
    </div>
    <div id="compare-picker-list" role="menu"
         aria-label="Choose another open slide"></div>
  </section>
</div>
<div id="frames">
  <div id="empty" hidden>
    <div>
      <div class="pyr" aria-hidden="true"><div class="l1"></div><div class="l2"></div><div class="l3"></div></div>
      <h1>Drop a slide to open</h1>
      <div class="sub"><b>.nd2</b>, <b>.svs</b>, or press + to browse</div>
    </div>
  </div>
  <div id="compare-divider" hidden aria-hidden="true"></div>
  <div id="compare-controls" role="toolbar" aria-label="Linked slides" hidden>
    <div class="compare-row">
      <span id="compare-status">Linked</span>
      <div id="compare-chips" aria-label="Linked slides"></div>
      <button id="compare-add" class="compare-control" type="button"
              title="Link another open slide" aria-label="Link another slide"
              aria-haspopup="menu" aria-expanded="false" aria-controls="compare-picker-list">+</button>
      <span id="compare-delta" hidden></span>
      <button id="compare-link" class="compare-control linked" type="button"
              aria-label="Unlink views" aria-pressed="true">
        <svg class="hotspot-icon" viewBox="0 0 28 18" aria-hidden="true">
          <path d="M11.2 4.2H8.5a4.8 4.8 0 0 0 0 9.6h2.7" />
          <path d="M16.8 4.2h2.7a4.8 4.8 0 0 1 0 9.6h-2.7" />
          <path d="M9.7 9h8.6" />
        </svg>
      </button>
      <button id="compare-swap" class="compare-control" type="button"
              title="Swap sides" aria-label="Swap the anchor and the linked slide">⇄</button>
      <button id="compare-rotate" class="compare-control text-control" type="button"
              title="Toggle the 180° scan orientation"
              aria-label="Rotate linked orientation 180 degrees"
              aria-pressed="false">180°</button>
      <button id="compare-mirror" class="compare-control text-control" type="button"
              title="Mirror the linked slides left-to-right"
              aria-label="Mirror linked orientation left to right"
              aria-pressed="false">Mirror</button>
      <button id="compare-align" class="compare-control text-control" type="button"
              title="Align with four points on every slide"
              aria-label="Align with landmarks" aria-pressed="false">Align</button>
      <button id="compare-close" class="compare-control" type="button"
              title="Close compare" aria-label="Close compare">×</button>
    </div>
    <div id="compare-landmarks" class="compare-row landmark-panel" hidden>
      <div id="compare-landmark-rows"></div>
      <div id="compare-landmark-hint" class="landmark-hint"></div>
      <div class="landmark-actions">
        <button id="compare-landmark-clear" class="compare-control text-control" type="button"
                title="Remove every point and return to matched centers">Clear</button>
        <button id="compare-landmark-cancel" class="compare-control text-control" type="button"
                title="Leave alignment mode and put back the previous alignment (esc)">Cancel</button>
        <button id="compare-landmark-done" class="compare-control text-control primary" type="button"
                title="Keep this alignment (⏎)">Done</button>
      </div>
    </div>
  </div>
</div>
<div id="shell-toast" role="alert" aria-live="assertive"></div>
<script src="static/align-v1.js"></script>
<script src="static/shortcut-router-v1.js"></script>
<script src="static/shell-v1.js"></script>
</body>
</html>
