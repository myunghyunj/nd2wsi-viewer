<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>nd2wsi-viewer</title>
<style>
  :root.light {
    --canvas: #ececef;
    --bar: rgba(238, 238, 240, 0.99);
    --hairline: rgba(0, 0, 0, 0.10);
    --label: rgba(0, 0, 0, 0.85);
    --label-2: rgba(0, 0, 0, 0.55);
    --label-3: rgba(0, 0, 0, 0.32);
  }
  :root {
    --accent: #0a84ff;
    --canvas: #161618;
    --bar: rgba(24, 24, 26, 0.98);
    --hairline: rgba(255, 255, 255, 0.10);
    --label: rgba(255, 255, 255, 0.85);
    --label-2: rgba(255, 255, 255, 0.55);
    --label-3: rgba(255, 255, 255, 0.28);
    --font-text: "SF Pro Text", "SF Pro Display", -apple-system, BlinkMacSystemFont,
      "Helvetica Neue", sans-serif;
    --font-mono: "SF Mono", ui-monospace, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--canvas); overflow: hidden;
    font-family: var(--font-text); font-size: 13px; color: var(--label);
    -webkit-font-smoothing: antialiased; cursor: default; -webkit-user-select: none; }

  /* ---- browser-style tab strip ---- */
  #tabbar {
    display: flex; align-items: stretch; gap: 6px; height: 38px;
    padding: 5px 8px 0; background: var(--bar);
    box-shadow: inset 0 -0.5px 0 var(--hairline);
  }
  .tab {
    display: flex; align-items: center; gap: 7px; min-width: 0;
    flex: 0 1 220px; padding: 0 8px 0 11px; border-radius: 8px 8px 0 0;
    color: var(--label-2); font-size: 12px; position: relative;
  }
  .tab:hover { background: rgba(255, 255, 255, 0.05); color: var(--label); }
  :root.light .tab:hover { background: rgba(0, 0, 0, 0.05); }
  :root.light .tab .x:hover { background: rgba(0, 0, 0, 0.10); }
  :root.light #newtab:hover { background: rgba(0, 0, 0, 0.06); }
  :root.light .tab .tprog { background: rgba(0, 0, 0, 0.10); }
  .tab.active {
    background: var(--canvas); color: var(--label);
    box-shadow: 0 0 0 0.5px var(--hairline);
  }
  .tab .dot { width: 7px; height: 7px; border-radius: 50%; flex: none;
    background: var(--accent); opacity: 0.9; }
  .tab .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tab .x {
    border: 0; background: none; color: var(--label-3); font-size: 13px;
    padding: 1px 4px; border-radius: 4px; line-height: 1; flex: none; visibility: hidden;
  }
  .tab:hover .x, .tab.active .x { visibility: visible; }
  .tab .x:hover { background: rgba(255, 255, 255, 0.12); color: var(--label); }
  .tab.busy .dot { background: var(--label-3); animation: pulse 1s infinite alternate; }
  .tab .tprog { position: absolute; left: 6px; right: 6px; bottom: 0; height: 3px;
    border-radius: 2px 2px 0 0; background: rgba(255, 255, 255, 0.10); overflow: hidden; }
  .tab .tprog span { display: block; height: 100%; width: 0%; background: #b08900;
    transition: width 0.3s ease; }
  .tab .tprog span.indet { width: 26%; animation: slide 1.1s infinite ease-in-out; }
  @keyframes slide { 0% { margin-left: 0; } 50% { margin-left: 74%; } 100% { margin-left: 0; } }
  @keyframes pulse { from { opacity: 0.3; } to { opacity: 1; } }
  #newtab {
    border: 0; background: none; color: var(--label-2); font-size: 17px;
    width: 30px; margin: 3px 0; border-radius: 6px; flex: none; align-self: center;
    height: 26px; line-height: 1;
  }
  #newtab:hover { background: rgba(255, 255, 255, 0.08); color: var(--label); }

  #frames { position: fixed; inset: 38px 0 0 0; }
  #frames iframe { position: absolute; inset: 0; width: 100%; height: 100%;
    border: 0; display: none; background: var(--canvas); }
  #frames iframe.active { display: block; }

  #empty { position: absolute; inset: 0; display: flex; align-items: center;
    justify-content: center; text-align: center; }
  #empty .pyr { width: 64px; margin: 0 auto 26px; opacity: 0.9; }
  #empty .pyr div { height: 11px; border-radius: 6px; margin: 4px auto;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35); }
  #empty .l1 { width: 26px; background: #7cc0ff; }
  #empty .l2 { width: 44px; background: #3fa0ff; }
  #empty .l3 { width: 62px; background: var(--accent); }
  #empty h1 { font-size: 15px; font-weight: 600; margin: 0; }
  #empty .sub { color: var(--label-3); font-size: 13px; margin-top: 7px; }
  #empty .sub b { color: var(--label-2); font-weight: 600; }

  #dropzone { position: fixed; inset: 0; z-index: 200; }
  #dropzone::after { content: ""; position: fixed; inset: 46px 8px 8px;
    border-radius: 16px; border: 2px dashed rgba(10, 132, 255, 0.9);
    background: rgba(10, 132, 255, 0.06); pointer-events: none; }
</style>
</head>
<body>
<div id="dropzone" hidden></div>
<div id="tabbar">
  <button id="newtab" title="Open another slide (.nd2 / .svs)">+</button>
</div>
<div id="frames">
  <div id="empty" hidden>
    <div>
      <div class="pyr"><div class="l1"></div><div class="l2"></div><div class="l3"></div></div>
      <h1>Drop a slide to open</h1>
      <div class="sub"><b>.nd2</b> or <b>.svs</b> &nbsp;&middot;&nbsp; or press + to browse</div>
    </div>
  </div>
</div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
try {
  if (localStorage.getItem("nd2wsi.theme") === "light")
    document.documentElement.classList.add("light");
} catch (e) { /* ok */ }

const frames = new Map(); // sid -> iframe
let slides = [];
let active = null;
let busyTab = null; // {name, job, pct} while /api/open runs
let busyTimer = null;

function render() {
  const bar = $("tabbar");
  bar.querySelectorAll(".tab").forEach((t) => t.remove());
  const plus = $("newtab");
  const mk = (s, busy) => {
    const t = document.createElement("div");
    t.className = "tab" + (busy ? " busy" : s.sid === active ? " active" : "");
    t.title = s.name;
    const dot = document.createElement("span");
    dot.className = "dot";
    const name = document.createElement("span");
    name.className = "name";
    name.textContent = s.name;
    t.append(dot, name);
    if (busy) {
      const p = document.createElement("div");
      p.className = "tprog";
      const f = document.createElement("span");
      if (s.pct > 0) f.style.width = s.pct + "%";
      else f.className = "indet";
      p.append(f);
      t.append(p);
    }
    if (!busy) {
      const x = document.createElement("button");
      x.className = "x";
      x.textContent = "×";
      x.title = "Close tab";
      x.onclick = (ev) => { ev.stopPropagation(); closeTab(s.sid); };
      t.append(x);
      t.onclick = () => activate(s.sid);
    }
    bar.insertBefore(t, plus);
  };
  slides.forEach((s) => mk(s, false));
  if (busyTab) mk(busyTab, true);
  $("empty").hidden = slides.length > 0 || !!busyTab;
  document.title = active
    ? (slides.find((s) => s.sid === active) || {}).name + " — nd2wsi-viewer"
    : "nd2wsi-viewer";
}

function activate(sid) {
  active = sid;
  if (sid && !frames.has(sid)) {
    const f = document.createElement("iframe");
    f.src = "/s/" + sid + "/";
    frames.set(sid, f);
    $("frames").append(f);
  }
  for (const [k, f] of frames) f.classList.toggle("active", k === active);
  render();
}

function refresh(selectSid) {
  return fetch("/api/slides").then((r) => r.json()).then((d) => {
    slides = d.slides || [];
    for (const [k, f] of [...frames]) {
      if (!slides.some((s) => s.sid === k)) { f.remove(); frames.delete(k); }
    }
    if (selectSid) activate(selectSid);
    else if (!slides.some((s) => s.sid === active)) {
      activate(slides.length ? slides[slides.length - 1].sid : null);
    } else render();
  });
}

function openPath(path) {
  const job = Math.random().toString(36).slice(2, 10);
  const name = path.split("/").pop();
  busyTab = { name: "Opening " + name + "…", job, pct: null };
  render();
  clearInterval(busyTimer);
  busyTimer = setInterval(() => {
    fetch("/api/roi/progress?job=" + job, { cache: "no-store" })
      .then((r) => r.json())
      .then((d) => {
        if (!busyTab) return;
        if (d.state === "converting") {
          busyTab.pct = d.pct || 0;
          busyTab.name = busyTab.pct > 0
            ? "Converting " + name + " " + busyTab.pct + " %"
            : "Preparing " + name + " …";
          render();
        }
      })
      .catch(() => {});
  }, 400);
  fetch("/api/open", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ path, job }),
  })
    .then((r) => r.json())
    .then((d) => {
      clearInterval(busyTimer);
      busyTab = null;
      if (d.error) { alert(d.error); render(); return; }
      refresh(d.sid);
    })
    .catch((e) => { clearInterval(busyTimer); busyTab = null; render(); alert("open failed: " + e); });
}

function closeTab(sid) {
  fetch("/api/close", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ sid }),
  }).then(() => refresh());
}

$("newtab").onclick = () => {
  if (window.pywebview && window.pywebview.api && window.pywebview.api.pick_path) {
    window.pywebview.api.pick_path().then((p) => { if (p) openPath(p); });
  } else {
    const p = prompt("Path to a .nd2 / .svs slide (or a pyramid_*.ome.zarr store):");
    if (p) openPath(p.trim());
  }
};

/* Drag and drop. In the app, pywebview's Python side receives the real
   file path and calls __pydrop. The overlay makes drops over the slide
   iframes land on this document instead of the iframe's. */
const zone = $("dropzone");
window.__pydrop = (p) => { zone.hidden = true; openPath(p); };
window.addEventListener("dragenter", (ev) => {
  const types = ev.dataTransfer ? Array.from(ev.dataTransfer.types || []) : [];
  if (types.includes("Files")) zone.hidden = false;
});
window.addEventListener("dragover", (ev) => ev.preventDefault());
zone.addEventListener("dragleave", (ev) => {
  if (ev.target === zone) zone.hidden = true;
});
zone.addEventListener("drop", (ev) => {
  ev.preventDefault();
  zone.hidden = true;
  if (window.pywebview) return; // the Python handler delivers the path
  const f = ev.dataTransfer.files[0];
  const p = f && (f.pywebviewFullPath || f.path);
  if (p) openPath(p);
  else alert("Browsers hide dropped file paths. Use + and type the path, or use the macOS app.");
});
window.addEventListener("drop", (ev) => ev.preventDefault());

window.addEventListener("message", (ev) => {
  if (!ev.data) return;
  if (ev.data.nd2wsi === "slide-trashed") refresh();
  if (ev.data.nd2wsi === "file-drag") zone.hidden = false;
  if (ev.data.nd2wsi === "theme") {
    document.documentElement.classList.toggle("light", ev.data.theme === "light");
    try { localStorage.setItem("nd2wsi.theme", ev.data.theme); } catch (e) { /* ok */ }
    for (const [, f] of frames) {
      if (f.contentWindow && f.contentWindow !== ev.source) {
        f.contentWindow.postMessage(ev.data, "*");
      }
    }
  }
});

refresh();
</script>
</body>
</html>
