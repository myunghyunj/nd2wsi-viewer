<!doctype html><html data-update-card-shell="true" lang="en"><head><meta charset="utf-8"><style>
  html,body{height:100%;margin:0;background:var(--canvas);color:var(--label);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",sans-serif;
    -webkit-font-smoothing:antialiased;cursor:default;-webkit-user-select:none}
  #drop{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  .card{text-align:center;pointer-events:none}
  .pyr{width:64px;margin:0 auto 26px;opacity:.9}
  .pyr div{height:11px;border-radius:6px;margin:4px auto;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
  .pyr .l1{width:26px;background:#7cc0ff}.pyr .l2{width:44px;background:#3fa0ff}
  .pyr .l3{width:62px;background:#0a84ff}
  h1{font-size:15px;font-weight:600;margin:0;color:var(--label)}
  .sub{color:var(--label-3);font-size:13px;margin-top:7px}
  .sub b{color:var(--label-2);font-weight:600}
  #status{margin-top:26px;font-size:12px;color:var(--label-2);min-height:16px;
    font-family:ui-monospace,"SF Mono",Menlo,monospace}
  #bar{width:180px;height:4px;border-radius:2px;margin:10px auto 0;
    background:var(--material-control-active);overflow:hidden;display:none}
  #fill{display:block;height:100%;width:0%;border-radius:2px;background:#b08900;
    transition:width .25s ease}
  #fill.indet{width:40%;transition:none;
    animation:indet 1.1s ease-in-out infinite alternate}
  @keyframes indet{from{margin-left:0}to{margin-left:60%}}
  #pct{margin-top:7px;font-size:12px;color:var(--label-2);min-height:14px;
    font-family:ui-monospace,"SF Mono",Menlo,monospace}
  #drop.over::after{content:"";position:fixed;inset:14px;border-radius:16px;
    border:2px dashed rgba(10,132,255,.9);background:rgba(10,132,255,.06)}
  .recent-wrap{margin:22px auto 0;width:min(440px,calc(100vw - 48px));
    text-align:left;pointer-events:auto}
  .recent-wrap[hidden]{display:none}
  .recent-title{font-size:11px;font-weight:600;letter-spacing:.04em;
    text-transform:uppercase;color:var(--label-3);padding:0 8px 6px}
  .recent-list{display:flex;flex-direction:column;gap:2px;max-height:188px;
    overflow-y:auto;padding:4px;border-radius:10px;
    border:1px solid var(--hairline,rgba(255,255,255,.10));
    background:var(--material-control,rgba(255,255,255,.04))}
  .recent-item{display:flex;align-items:baseline;justify-content:space-between;
    gap:12px;width:100%;padding:6px 9px;border:0;border-radius:7px;
    background:transparent;color:var(--label);text-align:left;cursor:pointer;
    font:12px -apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif}
  .recent-item:hover{background:rgba(10,132,255,.16)}
  .recent-item:focus-visible{outline:2px solid #0a84ff;outline-offset:-1px}
  .recent-name{font-weight:550;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;min-width:0;flex:0 1 auto}
  .recent-dir{font-size:11px;color:var(--label-3);overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1 1 auto;
    text-align:right;font-family:ui-monospace,"SF Mono",Menlo,monospace}
  #update{position:fixed;right:12px;bottom:10px;height:28px;padding:0 11px;
    border:0;border-radius:7px;background:transparent;color:var(--label-2);
    font:12px -apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif}
  #update:hover{background:var(--material-control);color:var(--label)}
  #update:disabled{opacity:.45}
  body:has(#update-notice:not([hidden])) #update{visibility:hidden;pointer-events:none}
</style></head><body>
<div id="drop"><div class="card">
  <div class="pyr"><div class="l1"></div><div class="l2"></div><div class="l3"></div></div>
  <h1>Drop a slide to open</h1>
  <div class="sub"><b>.nd2</b> · <b>.czi</b> · <b>.lif</b> · <b>.tif / .ome.tif</b> · <b>.svs</b> · <b>.sdpc</b> · <b>.nd2svs</b> · <b>.jpg</b> · <b>.png</b> &nbsp;·&nbsp; click anywhere to browse</div>
  <div id="status"></div>
  <div id="bar"><span id="fill"></span></div>
  <div id="pct"></div>
  <div id="recent-files" class="recent-wrap" hidden>
    <div class="recent-title">Recent</div>
    <div id="recent-list" class="recent-list" role="list" aria-label="Recent files"></div>
  </div>
</div></div>
<button id="update" type="button">Check for Updates…</button>
<script>
  let busy = false, polling = null, queuedDrops = [], dragDepth = 0;
  const drop = document.getElementById('drop');
  function setStatus(t){ document.getElementById('status').textContent = t || ''; }
  const bar = document.getElementById('bar'), fill = document.getElementById('fill');
  function poll(){
    pywebview.api.status().then(s => { if (s) setStatus(s); });
    pywebview.api.progress().then(f => {
      const pctEl = document.getElementById('pct');
      if (f === 0) {            /* alive, before the first real tick */
        bar.style.display = 'block';
        fill.style.width = '';
        fill.classList.add('indet');
        pctEl.textContent = '';
      } else if (f > 0) {
        bar.style.display = 'block';
        fill.classList.remove('indet');
        const p = Math.round(f * 100);
        fill.style.width = p + '%';
        pctEl.textContent = p + ' %';
      } else { bar.style.display = 'none'; fill.classList.remove('indet'); pctEl.textContent = ''; }
    });
  }
  function begin(){ clearInterval(polling); busy = true; polling = setInterval(poll, 400); }
  function end(msg){ clearInterval(polling); polling = null; busy = false; setStatus(msg || ''); bar.style.display='none'; document.getElementById('pct').textContent=''; }
  async function drainQueued(lastUrl){
    let url = lastUrl;
    while (queuedDrops.length) {
      const next = queuedDrops.splice(0);
      const u = await pywebview.api.open_paths(next);
      if (u) url = u;
    }
    return url;
  }
  function go(promise){
    begin();
    promise.then(url => drainQueued(url))
      .then(async url => {
        if (url) {
          if (window.nd2wsiUpdateCard?.handoff) await window.nd2wsiUpdateCard.handoff();
          location.replace(url);
        } else {
          const s = await pywebview.api.status().catch(() => '');
          end(s || '');
        }
      })
      .catch(e => end('failed: ' + e));
  }
  document.getElementById('recent-files').addEventListener('click', ev => ev.stopPropagation());
  drop.addEventListener('click', () => { if (!busy) go(pywebview.api.open_slide()); });
  // pywebview 6 delivers dropped-file paths through a Python-side DOM
  // handler, which calls __pydrop with the real path. The JS listeners
  // below only run the visuals.
  window.__pydrop_multi = paths => {
    if (busy) { queuedDrops.push(...(paths || [])); return; }
    go(pywebview.api.open_paths(paths));
  };
  window.__pydrop = path => window.__pydrop_multi([path]);
  document.addEventListener('dragover', ev => ev.preventDefault(), true);
  document.addEventListener('drop', ev => ev.preventDefault(), true);
  window.addEventListener('dragenter', ev => { ev.preventDefault(); dragDepth += 1; drop.classList.add('over'); });
  window.addEventListener('dragover', ev => { ev.preventDefault(); drop.classList.add('over'); });
  window.addEventListener('dragleave', () => { dragDepth = Math.max(0, dragDepth - 1); if (dragDepth === 0) drop.classList.remove('over'); });
  window.addEventListener('drop', ev => {
    ev.preventDefault();
    dragDepth = 0;
    drop.classList.remove('over');
  });
  function bootApiUrl(sub){
    const p = String(location.pathname || '');
    if (p && p !== '/' && !p.endsWith('.html')) {
      const base = p.includes('/static/') ? p.slice(0, p.indexOf('/static/')) : p.replace(/\/+$/, '');
      if (base) return base + sub;
    }
    return sub;
  }
  function safeSlideUrl(rawUrl, sid){
    if (typeof rawUrl === 'string' && /^(\/[A-Za-z0-9._~%-]+)?\/s\/[A-Za-z0-9_-]+\/$/.test(rawUrl)) {
      return rawUrl.startsWith('/s/') ? bootApiUrl(rawUrl) : rawUrl;
    }
    if (typeof sid === 'string' && /^[A-Za-z0-9_-]+$/.test(sid)) {
      return bootApiUrl('/s/' + encodeURIComponent(sid) + '/');
    }
    return '';
  }
  function openRecentPath(path){
    if (busy || !path) return;
    if (typeof window.pywebview?.api?.open_paths === 'function') {
      go(window.pywebview.api.open_paths([path]));
      return;
    }
    if (typeof window.pywebview?.api?.open_path === 'function') {
      go(window.pywebview.api.open_path(path));
      return;
    }
    if (typeof fetch === 'function') {
      busy = true;
      setStatus('opening ' + (String(path).split(/[\\/]/).pop() || path) + ' …');
      fetch(bootApiUrl('/api/open'), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ path }),
      }).then(r => r.json()).then(d => {
        const nextUrl = safeSlideUrl(d?.url, d?.sid);
        if (nextUrl) location.replace(nextUrl);
        else end(d?.error || '');
      }).catch(e => end('failed: ' + e));
    }
  }
  function renderRecentFiles(payload){
    const raw = Array.isArray(payload) ? payload
      : (payload?.items || payload?.files || payload?.recent || []);
    const items = raw.filter(it => it && typeof it.path === 'string' && it.path && it.available !== false);
    const wrap = document.getElementById('recent-files');
    const list = document.getElementById('recent-list');
    if (!wrap || !list) return;
    list.replaceChildren();
    if (!items.length) { wrap.hidden = true; return; }
    items.slice(0, 8).forEach(item => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'recent-item';
      btn.title = item.path;
      const name = document.createElement('span');
      name.className = 'recent-name';
      name.textContent = item.name || String(item.path).split(/[\\/]/).pop() || item.path;
      const dir = document.createElement('span');
      dir.className = 'recent-dir';
      const parent = String(item.path).replace(/[\\/][^\\/]+$/, '');
      dir.textContent = parent !== item.path ? parent : '';
      btn.append(name, dir);
      btn.addEventListener('click', ev => {
        ev.stopPropagation();
        openRecentPath(item.path);
      });
      list.append(btn);
    });
    wrap.hidden = false;
  }
  function loadRecentFiles(){
    if (typeof fetch !== 'function') return;
    fetch(bootApiUrl('/api/recent-files'), { cache: 'no-store' })
      .then(r => (r && r.ok && typeof r.json === 'function' ? r.json() : null))
      .then(data => { if (data) renderRecentFiles(data); })
      .catch(() => {});
  }
  loadRecentFiles();
  window.addEventListener('pywebviewready', () => {
    pywebview.api.pending().then(p => { if (p && !busy) go(pywebview.api.open_slide()); });
    if (typeof pywebview.api?.recent_files === 'function') {
      Promise.resolve(pywebview.api.recent_files())
        .then(data => { if (data && document.getElementById('recent-files')?.hidden) renderRecentFiles(data); })
        .catch(() => {});
    }
    const refreshUpdates = () => pywebview.api.update_status().then(s => {
        const button = document.getElementById('update');
        button.dataset.available = s.available ? '1' : '0';
        button.disabled = !s.available;
        if (s.mode === 'download') button.textContent = 'Download Updates…';
      });
    refreshUpdates();
    setTimeout(refreshUpdates, 600);
  });
  document.getElementById('update').addEventListener('click', ev => {
    const button = ev.currentTarget;
    button.disabled = true;
    Promise.resolve().then(() => typeof window.nd2wsiUpdateCard?.check === 'function'
      ? window.nd2wsiUpdateCard.check() : pywebview.api.check_for_updates())
      .then(result => { if (result?.ok === false) setStatus(result.message || 'Could not check for updates.'); })
      .catch(error => setStatus('Could not check for updates: ' + error))
      .finally(() => { button.disabled = button.dataset?.available === '0'; });
  });
</script></body></html>
