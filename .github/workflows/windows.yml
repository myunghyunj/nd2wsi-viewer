name: windows

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Exact 40-character commit SHA to build and verify
        required: true
        type: string
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['updates/**', 'docs/release-notes-*.md']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      ND2WSI_SMOKE_LUT_CLIPBOARD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Verify the requested source commit
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          REQUESTED_REF: ${{ inputs.ref }}
        run: |
          if ($env:REQUESTED_REF -cnotmatch '^[0-9a-f]{40}$') { throw 'ref must be a full lowercase commit SHA' }
          if ((git rev-parse HEAD) -ne $env:REQUESTED_REF) { throw 'Checked out the wrong commit' }
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.13.14'
          architecture: x64
      - uses: astral-sh/setup-uv@v5
        with:
          version: '0.12.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the locked runtime and build tools
        shell: pwsh
        run: |
          uv sync --frozen --all-extras --python "$env:pythonLocation\python.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Locked runtime installation failed' }
          uv pip install --python .venv/Scripts/python.exe --require-hashes --no-config --default-index https://pypi.org/simple -r packaging/windows-build-requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'Locked build tooling installation failed' }
      - name: Windows unit and integration tests
        timeout-minutes: 10
        run: .venv/Scripts/python.exe -m pytest tests -q -rfE --tb=short -m 'not realdata' -n 4 --dist loadfile --durations=25 --junitxml=${{ runner.temp }}/test-results/windows-unit.xml
      # The report lives outside the checkout so build provenance still sees a clean tree.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-unit-test-results
          path: ${{ runner.temp }}/test-results/windows-unit.xml
          retention-days: 30
      - name: Fetch checksum-verified real ND2 acquisitions
        run: .venv/Scripts/python.exe scripts/fetch_testdata.py
      - name: Windows real-data tests
        run: .venv/Scripts/python.exe -m pytest tests -q -m realdata
      - name: Prepare Microsoft WebView2
        shell: pwsh
        run: ./packaging/ensure_webview2.ps1
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      # Pull requests and main pushes reuse the decoder built from the same pinned
      # inputs. Tags and workflow_dispatch never restore it: they build from source.
      - name: Restore the pinned SDPC decoder build
        id: sdpc-codec-cache
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch')
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/sdpc-codec
          key: sdpc-codec-v1-${{ runner.os }}-${{ runner.arch }}-py${{ steps.python.outputs.python-version }}-${{ hashFiles('packaging/build_sdpc_codec.py', 'packaging/verify_sdpc_codec.py', 'packaging/SDPC-CODEC-NOTICE.txt') }}
      # A restored build is used only if verify_sdpc_codec.py accepts it again and it
      # carries this checkout's build inputs byte for byte. Otherwise build from source.
      - name: Re-verify the restored SDPC decoder build
        id: sdpc-codec-reuse
        if: steps.sdpc-codec-cache.outputs.cache-hit == 'true'
        shell: python
        env:
          SDPC_CODEC_KEY: ${{ steps.sdpc-codec-cache.outputs.cache-matched-key }}
        run: |
          import json, os, platform, subprocess, sys, zipfile
          from pathlib import Path

          cache = Path(os.environ["RUNNER_TEMP"], "sdpc-codec")
          manifest_path = cache / "sdpc-codec-manifest.json"
          try:
              if subprocess.run([sys.executable, "packaging/verify_sdpc_codec.py",
                                 "--manifest", str(manifest_path), "--wheel-only"]).returncode:
                  raise ValueError("verify_sdpc_codec.py rejected it")
              manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
              built_for = (manifest["platform"], manifest["python_version"])
              if built_for != ("windows-x64", platform.python_version()):
                  raise ValueError(f"it was built for {built_for}")
              checkout = {name: Path("packaging", name).read_bytes()
                          for name in ("build_sdpc_codec.py", "verify_sdpc_codec.py", "SDPC-CODEC-NOTICE.txt")}
              licenses = cache / manifest["licenses_directory"]
              if (licenses / "SDPC-CODEC-NOTICE.txt").read_bytes() != checkout["SDPC-CODEC-NOTICE.txt"]:
                  raise ValueError("its licenses/SDPC-CODEC-NOTICE.txt differs from this checkout")
              with zipfile.ZipFile(cache / manifest["source_archive_file"]) as archive:
                  for name, content in checkout.items():
                      if archive.read("packaging/" + name) != content:
                          raise ValueError(f"its packaging/{name} differs from this checkout")
          except (OSError, KeyError, ValueError, zipfile.BadZipFile) as error:
              print(f"::warning title=SDPC decoder cache rejected::Building from source instead ({error}). "
                    f"Delete the cache entry {os.environ['SDPC_CODEC_KEY']} so a later run can save a fresh one.", flush=True)
          else:
              print("::notice title=SDPC decoder restored from cache::This run's Windows artifacts reuse a "
                    "cached decoder. Take release assets from a tag or workflow_dispatch run.", flush=True)
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                  output.write("reuse=true\n")
      - uses: msys2/setup-msys2@v2
        id: msys2
        if: steps.sdpc-codec-reuse.outputs.reuse != 'true'
        with:
          msystem: MSYS
          path-type: inherit
          install: make diffutils
      - name: Build and install the source-verified LGPL SDPC decoder
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
          SDPC_CODEC_REUSE: ${{ steps.sdpc-codec-reuse.outputs.reuse }}
        run: |
          if ($env:SDPC_CODEC_REUSE -ceq 'true') {
            $codecOutput = Join-Path $env:RUNNER_TEMP 'sdpc-codec'
          }
          else {
            $codecOutput = Join-Path $env:GITHUB_WORKSPACE 'build\sdpc-codec'
            $msysBash = Join-Path $env:MSYS2_LOCATION 'usr\bin\bash.exe'
            .venv/Scripts/python.exe packaging/build_sdpc_codec.py --output $codecOutput --jobs 6 --msys-bash $msysBash
            if ($LASTEXITCODE -ne 0) { throw 'Source-built SDPC codec failed' }
          }
          $codecManifest = Join-Path $codecOutput 'sdpc-codec-manifest.json'
          $codecMetadata = Get-Content -LiteralPath $codecManifest -Raw -Encoding UTF8 | ConvertFrom-Json
          $codecWheel = Join-Path $codecOutput $codecMetadata.wheel_file
          .venv/Scripts/python.exe packaging/verify_sdpc_codec.py --manifest $codecManifest --wheel-only
          if ($LASTEXITCODE -ne 0) { throw 'SDPC codec build artifacts failed verification' }
          uv pip install --python .venv/Scripts/python.exe --no-deps --reinstall $codecWheel
          if ($LASTEXITCODE -ne 0) { throw 'Source-built SDPC wheel installation failed' }
          .venv/Scripts/python.exe packaging/verify_sdpc_codec.py --manifest $codecManifest
          if ($LASTEXITCODE -ne 0) { throw 'Installed SDPC runtime failed verification' }
          "ND2WSI_SDPC_CODEC_MANIFEST=$codecManifest" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build executable and require packaged headless and GUI smoke
        run: .venv/Scripts/python.exe packaging/build_windows.py --smoke-file docs/example_cell.nd2
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-portable
          path: |
            dist/windows/nd2wsi-viewer-*-windows-x64.zip
            dist/windows/nd2wsi-viewer-*-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: sdpc-codec-sources-windows-x64
          path: |
            dist/windows/sdpc-codec-sources-windows-x64.zip
            dist/windows/sdpc-codec-sources-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: windows-smoke-fixture
          path: docs/example_cell.nd2
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-build-evidence
          path: dist/windows/build-smoke/
          retention-days: 30
      # Only a source-built decoder whose packaged SDPC smoke passed is cached.
      # Caching is best effort: it warns instead of failing the build.
      - name: Stage the source-built SDPC decoder for the cache
        id: sdpc-codec-stage
        if: steps.sdpc-codec-cache.outcome == 'success' && steps.sdpc-codec-cache.outputs.cache-hit != 'true'
        shell: python
        run: |
          import json, os, shutil, subprocess, sys
          from pathlib import Path

          source = Path("build/sdpc-codec")
          target = Path(os.environ["RUNNER_TEMP"], "sdpc-codec")
          try:
              manifest = json.loads((source / "sdpc-codec-manifest.json").read_text(encoding="utf-8"))
              target.mkdir()
              for name in ("sdpc-codec-manifest.json", manifest["wheel_file"], manifest["source_archive_file"]):
                  (target / name).parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(source / name, target / name)
              shutil.copytree(source / manifest["licenses_directory"], target / manifest["licenses_directory"])
              if subprocess.run([sys.executable, "packaging/verify_sdpc_codec.py",
                                 "--manifest", str(target / "sdpc-codec-manifest.json"), "--wheel-only"]).returncode:
                  raise ValueError("verify_sdpc_codec.py rejected the staged copy")
          except (OSError, KeyError, ValueError) as error:
              print(f"::warning title=SDPC decoder not cached::{error}", flush=True)
          else:
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                  output.write("staged=true\n")
      - name: Save the source-built SDPC decoder
        if: steps.sdpc-codec-stage.outputs.staged == 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/sdpc-codec
          key: ${{ steps.sdpc-codec-cache.outputs.cache-primary-key }}

  verify:
    needs: build
    env:
      ND2WSI_SMOKE_LUT_CLIPBOARD: '1'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            platform: x64
          - runner: windows-11-arm
            platform: arm64-emulation
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          name: windows-x64-portable
          path: dist/windows
      - uses: actions/download-artifact@v4
        with:
          name: windows-smoke-fixture
          path: testdata
      - name: Prepare Microsoft WebView2
        shell: pwsh
        run: ./packaging/ensure_webview2.ps1
      - name: Verify the shipped EXE with Korean and space-containing paths
        shell: pwsh
        run: |
          $archive = @(Get-ChildItem -LiteralPath dist/windows -Filter '*.zip')
          if ($archive.Count -ne 1) { throw 'Expected exactly one portable ZIP' }
          ./packaging/verify_windows.ps1 -Archive $archive[0].FullName -SmokeFile testdata/example_cell.nd2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-verification-${{ matrix.platform }}
          path: dist/windows/verification/
          retention-days: 30
