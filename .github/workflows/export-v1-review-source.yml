name: export-v1-review-source

on:
  push:
    branches:
      - review/v1.0.0-rc2

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Archive source tree
        run: |
          git archive --format=zip --output=nd2wsi-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: nd2wsi-v1-review-source
          path: nd2wsi-source.zip
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
