name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uvx ruff check nd2wsi tests scripts

  test:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install the locked environment
        run: uv sync --frozen --all-extras --python ${{ matrix.python }}
      - name: Unit and integration tests (synthetic fixtures)
        run: uv run --frozen python -m pytest tests -q -m "not realdata"

  package:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Build wheel and sdist, then install the wheel cold
        run: |
          uv build
          uv venv /tmp/wheeltest
          uv pip install -p /tmp/wheeltest dist/*.whl
          /tmp/wheeltest/bin/python -c "import nd2wsi.convert, nd2wsi.server, nd2wsi.direct, nd2wsi.app"
          /tmp/wheeltest/bin/nd2wsi --help >/dev/null
