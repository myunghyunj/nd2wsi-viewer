name: realdata

# The example acquisitions live as assets on the immutable testdata-v1
# release, checksum-verified by the fetch script. This gate runs the tests
# that need them, on demand and before a release.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  realdata:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Install the locked environment
        run: uv sync --frozen --all-extras --python 3.13
      - name: Fetch the example acquisitions
        run: uv run --frozen python scripts/fetch_testdata.py
      - name: Real-data suite
        run: uv run --frozen python -m pytest tests -q -m realdata
