name: realdata

# The example acquisitions live as assets on the immutable testdata-v1
# release, checksum-verified by the fetch script. This gate runs the tests
# that need them, on demand and before a release.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Exact 40-character commit SHA to test before tagging
        required: true
        type: string
  push:
    tags: ["v*"]

jobs:
  realdata:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Verify the manual gate targets the exact commit
        if: github.event_name == 'workflow_dispatch'
        env:
          REQUESTED_REF: ${{ inputs.ref }}
        run: |
          if [[ ! "$REQUESTED_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "ref must be a full lowercase commit SHA"
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$REQUESTED_REF"
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Install the locked environment
        run: uv sync --frozen --all-extras --python 3.13
      - name: Fetch the example acquisitions
        run: uv run --frozen python scripts/fetch_testdata.py
      - name: Real-data suite
        run: uv run --frozen python -m pytest tests -q -m realdata
