[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nd2wsi-viewer"
version = "1.0.1"
description = "Local whole-slide viewing for stitched Nikon ND2 and Aperio SVS, with native-value ROI export"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Myunghyun Jeong" }]
keywords = ["nd2", "nikon", "nis-elements", "svs", "ome-zarr", "ngff", "whole-slide", "microscopy", "openseadragon"]
dependencies = [
  "nd2>=0.10",
  "numpy>=1.24",
  "dask[array]>=2023.5",
  "zarr>=3.0",
  "numcodecs>=0.12",
  "pillow>=10",
  "tifffile>=2023.7",
]

[project.urls]
Homepage = "https://github.com/myunghyunj/nd2wsi-viewer"
Repository = "https://github.com/myunghyunj/nd2wsi-viewer"
Issues = "https://github.com/myunghyunj/nd2wsi-viewer/issues"
Changelog = "https://github.com/myunghyunj/nd2wsi-viewer/releases"

[project.optional-dependencies]
legacy = ["nd2[legacy]"]
test = ["pytest>=7"]
nd2export = ["limnd2>=0.4"]
app = ["pywebview>=6.0"]
svs = ["imagecodecs>=2023.9"]

[project.scripts]
nd2wsi = "nd2wsi.cli:main"
nd2wsi-viewer = "nd2wsi.app:main"

[tool.setuptools.packages.find]
include = ["nd2wsi*"]

[tool.setuptools.package-data]
nd2wsi = ["static/**/*"]

[tool.uv]
extra-index-url = ["https://pypi.laboratory-imaging.com/simple"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
markers = [
  "realdata: tests that need the example acquisitions from the testdata release",
]
