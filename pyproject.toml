[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nd2wsi-viewer"
version = "0.9.0"
description = "Nikon ND2 -> OME-Zarr pyramid -> browser slide viewer with native-resolution ROI export"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "nd2wsi-viewer" }]
keywords = ["nd2", "nikon", "nis-elements", "ome-zarr", "ngff", "whole-slide", "openseadragon"]
dependencies = [
  "nd2>=0.10",
  "numpy>=1.24",
  "dask[array]>=2023.5",
  "zarr>=3.0",
  "numcodecs>=0.12",
  "pillow>=10",
  "tifffile>=2023.7",
]

[project.optional-dependencies]
legacy = ["nd2[legacy]"]           # JPEG2000-era ND2 files (imagecodecs)
test = ["pytest>=7"]
# ND2 (re-)export -- limnd2 is on Laboratory Imaging's own index, so install
# with: pip install ".[nd2export]" --extra-index-url https://pypi.laboratory-imaging.com/simple
nd2export = ["limnd2>=0.4"]
app = ["pywebview>=6.0"]           # native macOS shell (nd2wsi-viewer command)
svs = ["imagecodecs>=2023.9"]      # JPEG tile decode for Aperio SVS input
# synthetic test-data generation uses Laboratory Imaging's limnd2 writer,
# which lives on their own package index -- see README ("Synthetic fixtures").

[project.scripts]
nd2wsi = "nd2wsi.cli:main"
nd2wsi-viewer = "nd2wsi.app:main"

[tool.setuptools.packages.find]
include = ["nd2wsi*"]

[tool.setuptools.package-data]
nd2wsi = ["static/**/*"]

[tool.uv]
# limnd2 (ND2 export) is published only on Laboratory Imaging's own index
extra-index-url = ["https://pypi.laboratory-imaging.com/simple"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# defensive blanket excepts are deliberate in the UI and cleanup paths, so the
# bug-hunting sets stay off; these four keep imports, syntax and style honest
select = ["E4", "E7", "E9", "F", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
markers = [
  "realdata: tests that need the example acquisitions from the testdata release",
]
